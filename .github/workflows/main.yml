name: RS Email Scraper Workflow

on:
  workflow_dispatch:
  schedule:
    - cron: '0 1 * * 1'  # Otomatis Senin jam 08:00 WIB

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Install Dependencies
      run: npm ci

    - name: Install Firefox Playwright
      run: npx playwright install firefox

    - name: Run Scraper (With Auto-Retry)
      run: |
        for attempt in 1 2 3; do 
          npm run scrape:collect && break
          echo "Scraping failed (attempt $attempt/3)"
          [[ "$attempt" -eq 3 ]] && exit 1
        done

    - name: Export JSON to Excel
      run: npm run scrape:export

    - name: Upload Excel Artifact
      uses: actions/upload-artifact@v4
      with:
        name: data-excel-rs
        path: data/output/Hasil_Scraping_RS.xlsx